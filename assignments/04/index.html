<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Java</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="content">
        <header id="main-header">
            <h1>Introduction to JavaScript</h1>
        </header>
        <main id="activities">
            <section class="activity" id="speech-area">
                <h3>Speech</h3>
                <p id="speech-bubble">Hi</p>
            </section>
            <section class="activity">
                <h3>Beverage</h3>
                <label for="beverage">Pick your morning beverage:</label>
                <select id="beverage">
                    <option>Coffee</option>
                    <option>Tea</option>
                    <option>Hot chocolate</option>
                </select>
                <p id="beverage-output"></p>
            </section>
            <section class="activity" id="sticker-area">
                <h3>Add a Sticker</h3>
                <img id="sun" src="sticker/sticker.webp" alt="sun">
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>

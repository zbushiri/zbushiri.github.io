<!DOCTYPE html>
<html lang="en">

<head>
    <title>Vacation Experiences</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Page Heading -->
    <header>
        <h1>Japanese Vacations</h1>
        <p>Explore Japan</p>
    </header>

    <main id="vacation-list"></main>

    <!-- Modal adapted from W3Schools: https://www.w3schools.com/howto/howto_css_modals.asp -->
    <div id="vacation-modal" class="modal">
        <div class="modal-content">
            <span id="close-btn" class="close">&times;</span>
            <div class="modal-body">
                <iframe id="vacation-map" title="Vacation map"></iframe>
                <section id="vacation-info"></section>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>@zbushiri.github.io</footer>
    <script src="script.js"></script>
</body>

</html>
